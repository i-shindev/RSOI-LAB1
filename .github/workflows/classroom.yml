name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  BASE_URL: https://lab1webservice.onrender.com

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Run unit tests
        run: cargo test --locked

      - name: Build Docker image
        run: docker build -t person-service:${{ github.sha }} .

      - name: Trigger Render deploy
        if: github.event_name == 'push'
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" -o /dev/null

      - name: Wait for the new revision to go live
        if: github.event_name == 'push'
        run: |
          echo "waiting for ${GITHUB_SHA} at ${BASE_URL}"
          for attempt in $(seq 1 60); do
            body=$(curl -fsS --max-time 20 "${BASE_URL}/manage/health" || true)
            live=$(printf '%s' "${body}" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "${live}" = "${GITHUB_SHA}" ]; then
              echo "revision ${GITHUB_SHA} is live after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}/60: live revision is '${live:-unknown}'"
            sleep 15
          done
          echo "::error::timed out after 15 minutes waiting for ${GITHUB_SHA}"
          exit 1

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: postman/[inst] Lab1.postman_collection.json
          environment: postman/[inst][heroku] Lab1.postman_environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 1
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"
