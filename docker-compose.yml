services:
  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d persons"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: person-service
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://program:test@postgres:5432/persons"
      PORT: "8080"
      RUST_LOG: "person_service=debug,info"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/manage/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  newman:
    image: postman/newman:alpine
    container_name: newman
    profiles: ["test"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./postman:/etc/newman
    command:
      - run
      - "[inst] Lab1.postman_collection.json"
      - --env-var
      - "baseUrl=http://app:8080"
      - --delay-request
      - "100"

volumes:
  db-data:
